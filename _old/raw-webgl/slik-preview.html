<title>SLIK Bolt Shader Wipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
  :root {
    --ground:     #f2f1ed;
    --ink:        #15171c;
    --ink-muted:  #6b7180;
    --hairline:   rgba(21, 23, 28, 0.10);
    --panel:      rgba(247, 246, 243, 0.84);
    --panel-edge: rgba(21, 23, 28, 0.12);
    --accent:     #009e94;
    --accent-dim: rgba(0, 158, 148, 0.16);
    --focus:      #007d75;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:     #08090c;
      --ink:        #e9ebf1;
      --ink-muted:  #79808f;
      --hairline:   rgba(233, 235, 241, 0.12);
      --panel:      rgba(14, 16, 21, 0.74);
      --panel-edge: rgba(233, 235, 241, 0.14);
      --accent:     #00e0d2;
      --accent-dim: rgba(0, 224, 210, 0.14);
      --focus:      #6ff5ea;
    }
  }
  :root[data-theme="dark"] {
    --ground:     #08090c;
    --ink:        #e9ebf1;
    --ink-muted:  #79808f;
    --hairline:   rgba(233, 235, 241, 0.12);
    --panel:      rgba(14, 16, 21, 0.74);
    --panel-edge: rgba(233, 235, 241, 0.14);
    --accent:     #00e0d2;
    --accent-dim: rgba(0, 224, 210, 0.14);
    --focus:      #6ff5ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage { position: relative; width: 100%; height: 100svh; min-height: 430px; }

  canvas#gl {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
  }
  canvas#gl.dragging { cursor: grabbing; }

  .mark {
    position: absolute; top: clamp(14px, 3vmin, 28px); left: clamp(14px, 3vmin, 28px);
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; z-index: 3;
  }
  .mark h1 {
    margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-weight: 600; font-size: 11.5px; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--ink);
  }
  .mark p { margin: 0; max-width: 32ch; font-size: 12px; line-height: 1.55; color: var(--ink-muted); }

  /* labels that sit over each half of the wipe */
  .side {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-muted); pointer-events: none; z-index: 2; opacity: .75;
    writing-mode: vertical-rl;
  }
  .side.l { left: clamp(14px, 3vmin, 28px); }
  .side.r { right: clamp(14px, 3vmin, 28px); rotate: 180deg; }

  .rail {
    position: absolute; left: 50%; bottom: clamp(14px, 3vmin, 28px);
    transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 1px; padding: 1px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    z-index: 4;
  }
  .grp { display: flex; gap: 1px; }
  .grp + .grp { margin-left: 8px; padding-left: 9px; border-left: 1px solid var(--hairline); }

  .rail button {
    appearance: none; border: 0; margin: 0; padding: 9px 12px;
    background: transparent; color: var(--ink-muted);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.13em;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
    transition: color .16s ease, background-color .16s ease;
  }
  .rail button:hover { color: var(--ink); }
  .rail button[aria-pressed="true"] { color: var(--accent); background: var(--accent-dim); }
  .rail button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  .lbl {
    display: flex; align-items: center; padding: 0 8px 0 3px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-muted); opacity: .66;
  }

  .fallback {
    position: absolute; inset: 0; display: none; place-content: center;
    padding: 30px; text-align: center; font-size: 13.5px; line-height: 1.6;
    color: var(--ink-muted);
  }
  .fallback.show { display: grid; }

  @media (max-width: 760px) {
    .mark p { display: none; }
    .side { display: none; }
    .rail button { padding: 9px 9px; }
  }
</style>

<div class="stage">
  <canvas id="gl" aria-label="Wipe comparison of the SLIK bolt shader, current versus new. Drag the divider."></canvas>

  <div class="mark">
    <h1>Bolt Shader Wipe</h1>
    <p>Your geometry, your three-pass pipeline, composited through hard-light exactly as the hero canvas does. Drag the divider; drag anywhere else to rotate.</p>
  </div>

  <div class="side l">Current</div>
  <div class="side r">New</div>

  <div class="rail" role="toolbar" aria-label="Preview controls">
    <span class="lbl">Ground</span>
    <div class="grp">
      <button id="bDark"  aria-pressed="true">#1e1e1e</button>
      <button id="bLight" aria-pressed="false">#f0f0f0</button>
    </div>
    <div class="grp">
      <button id="bStars"  aria-pressed="true">Stars</button>
      <button id="bMotion" aria-pressed="true">Motion</button>
      <button id="bReset">Reset</button>
    </div>
  </div>

  <div class="fallback" id="fallback">This preview needs WebGL2, which this browser has turned off or does not support.</div>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("gl");
  const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, powerPreference: "high-performance" });
  if (!gl) { document.getElementById("fallback").classList.add("show"); canvas.style.display = "none"; return; }

  /* ===================================================================
     Bolt outline, recovered from the boundary edges of the front cap of
     SLIK_LOGO_BOLT_01.glb and scaled so the half-height is 1.0
     (x9.124).  Depth follows the GLB's own ratio: 0.0424 / 0.2192.
     Wound counter-clockwise.
     =================================================================== */
  const OUTLINE = [
    [-0.5129, -0.3687],   // left point
    [-0.1159, -0.3687],   // inner corner, lower
    [-0.1159, -1.0000],   // bottom tip
    [ 0.5129,  0.3687],   // right point
    [ 0.1159,  0.3687],   // inner corner, upper
    [ 0.1159,  1.0000]    // top tip
  ];
  const DEPTH     = 0.3869;   // = 0.0424 * 9.124
  const BEVEL     = 0.030;
  const BEVEL_Z   = 0.030;
  const BSEG      = 10;
  const NRM_SWEEP = 0.86;

  /* ---- generic ear clipping so the cap needs no hand-built index ---- */
  function triangulate(poly) {
    const idx = poly.map((_, i) => i), tris = [];
    const area2 = (a, b, c) => (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
    const inTri = (p, a, b, c) => {
      const d1 = area2(p,a,b), d2 = area2(p,b,c), d3 = area2(p,c,a);
      return !(((d1<0)||(d2<0)||(d3<0)) && ((d1>0)||(d2>0)||(d3>0)));
    };
    let guard = 0;
    while (idx.length > 3 && guard++ < 500) {
      let clipped = false;
      for (let i = 0; i < idx.length; i++) {
        const i0 = idx[(i-1+idx.length)%idx.length], i1 = idx[i], i2 = idx[(i+1)%idx.length];
        const a = poly[i0], b = poly[i1], c = poly[i2];
        if (area2(a, b, c) <= 0) continue;
        let ok = true;
        for (const j of idx) {
          if (j === i0 || j === i1 || j === i2) continue;
          if (inTri(poly[j], a, b, c)) { ok = false; break; }
        }
        if (!ok) continue;
        tris.push([i0, i1, i2]);
        idx.splice(i, 1); clipped = true; break;
      }
      if (!clipped) break;
    }
    if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
    return tris;
  }

  function buildBolt() {
    const n = OUTLINE.length, nrm = [], len = [];
    for (let i = 0; i < n; i++) {
      const a = OUTLINE[i], b = OUTLINE[(i+1)%n];
      const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy);
      len.push(L); nrm.push([-dy/L, dx/L]);
    }
    function miter(i, inset) {
      const p = OUTLINE[i], n0 = nrm[(i-1+n)%n], n1 = nrm[i];
      let mx = n0[0]+n1[0], my = n0[1]+n1[1];
      const ml = Math.hypot(mx, my);
      if (ml < 1e-6) return [p[0]+n1[0]*inset, p[1]+n1[1]*inset];
      mx /= ml; my /= ml;
      const d = inset / Math.max(0.2, mx*n1[0] + my*n1[1]);
      return [p[0]+mx*d, p[1]+my*d];
    }

    const H = DEPTH*0.5, rings = [];
    for (let i = 0; i <= BSEG; i++) {
      const a = (1 - i/BSEG) * Math.PI * 0.5, q = a * NRM_SWEEP;
      rings.push({ inset: BEVEL*(1-Math.cos(a)), z: -(H-BEVEL_Z) - BEVEL_Z*Math.sin(a),
                   ca: Math.cos(q), sa: -Math.sin(q) });
    }
    for (let i = 0; i <= BSEG; i++) {
      const a = (i/BSEG) * Math.PI * 0.5, q = a * NRM_SWEEP;
      rings.push({ inset: BEVEL*(1-Math.cos(a)), z: (H-BEVEL_Z) + BEVEL_Z*Math.sin(a),
                   ca: Math.cos(q), sa: Math.sin(q) });
    }
    const last = rings.length - 1;

    const V = [];
    const push = (p, z, nx, ny, nz, w, wall) => V.push(p[0], p[1], z, nx, ny, nz, w, wall);

    for (let e = 0; e < n; e++) {
      const i0 = e, i1 = (e+1)%n;
      const ox = -nrm[e][0], oy = -nrm[e][1];
      for (let k = 0; k < last; k++) {
        const r0 = rings[k], r1 = rings[k+1];
        const w0 = k/last, w1 = (k+1)/last;
        const p00 = miter(i0, r0.inset), p10 = miter(i1, r0.inset);
        const p01 = miter(i0, r1.inset), p11 = miter(i1, r1.inset);
        const a0 = ox*r0.ca, b0 = oy*r0.ca, c0 = r0.sa;
        const a1 = ox*r1.ca, b1 = oy*r1.ca, c1 = r1.sa;
        push(p00, r0.z, a0,b0,c0, w0, 1); push(p10, r0.z, a0,b0,c0, w0, 1);
        push(p11, r1.z, a1,b1,c1, w1, 1);
        push(p00, r0.z, a0,b0,c0, w0, 1); push(p11, r1.z, a1,b1,c1, w1, 1);
        push(p01, r1.z, a1,b1,c1, w1, 1);
      }
    }

    const CP = []; for (let i = 0; i < n; i++) CP.push(miter(i, BEVEL));
    for (const t of triangulate(CP)) {
      for (const i of t)                  push(CP[i],  H, 0,0, 1, 1, 0);
      for (const i of [t[2],t[1],t[0]])   push(CP[i], -H, 0,0,-1, 0, 0);
    }
    return { data: new Float32Array(V), count: V.length/8 };
  }
  const BOLT = buildBolt();

  /* ---- matrices ---- */
  const perspective = (f_, a, n_, f2) => {
    const f = 1/Math.tan(f_*0.5), nf = 1/(n_-f2);
    return new Float32Array([f/a,0,0,0, 0,f,0,0, 0,0,(f2+n_)*nf,-1, 0,0,2*f2*n_*nf,0]);
  };
  function lookAt(e, t, u) {
    let zx=e[0]-t[0], zy=e[1]-t[1], zz=e[2]-t[2];
    let l=Math.hypot(zx,zy,zz); zx/=l; zy/=l; zz/=l;
    let xx=u[1]*zz-u[2]*zy, xy=u[2]*zx-u[0]*zz, xz=u[0]*zy-u[1]*zx;
    l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
    const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
    return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
      -(xx*e[0]+xy*e[1]+xz*e[2]), -(yx*e[0]+yy*e[1]+yz*e[2]), -(zx*e[0]+zy*e[1]+zz*e[2]), 1]);
  }
  function mul(a,b){ const o=new Float32Array(16);
    for(let c=0;c<4;c++) for(let r=0;r<4;r++)
      o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];
    return o; }
  function rotXY(rx, ry) {
    const cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry);
    return new Float32Array([ cy,0,-sy,0,  sx*sy,cx,sx*cy,0,  cx*sy,-sx,cx*cy,0,  0,0,0,1 ]);
  }
  const mat3of = m => new Float32Array([m[0],m[1],m[2], m[4],m[5],m[6], m[8],m[9],m[10]]);

  /* ---- gl helpers ---- */
  function compile(t, src) {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s), src); throw new Error("compile"); }
    return s;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); throw new Error("link"); }
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ""); u[nm] = gl.getUniformLocation(p, nm); }
    return { p, u };
  }

  const QUAD_VS = `#version 300 es
  void main(){ vec2 p = vec2(float((gl_VertexID & 1) << 2) - 1.0, float((gl_VertexID & 2) << 1) - 1.0);
    gl_Position = vec4(p, 0.0, 1.0); }`;

  /* Starfield — stands in for the particle render target that feeds
     uTexture on the real site.  Alpha marks where the canvas is painted,
     so the hard-light composite can match the CSS blend. */
  const BG_FS = `#version 300 es
  precision highp float;
  uniform vec2 uRes; uniform float uStars;
  out vec4 fragColor;
  float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
  float specks(vec2 p, float sc, float dens, float size){
    vec2 g=p*sc, id=floor(g), f=fract(g);
    if (h21(id) > dens) return 0.0;
    vec2 c = vec2(h21(id+11.3), h21(id+27.7));
    float d = max(abs(f.x-c.x), abs(f.y-c.y));
    float r = size*(0.45+0.85*h21(id+3.1));
    return smoothstep(r, r*0.35, d) * (0.35+0.65*h21(id+7.7));
  }
  void main(){
    vec2 p = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
    float s = specks(p+vec2(0.13,0.07), 17.0, 0.42, 0.052)*0.95
            + specks(p-vec2(0.41,0.22), 34.0, 0.30, 0.070)*0.55
            + specks(p+vec2(0.77,0.51), 62.0, 0.22, 0.095)*0.28;
    s *= uStars;
    fragColor = vec4(vec3(0.92,0.94,1.0)*s, s);
  }`;

  const BOLT_VS = `#version 300 es
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aNrm;
  layout(location=2) in float aW;
  layout(location=3) in float aWall;
  uniform mat4 uModel, uViewProj; uniform mat3 uNormalMat;
  out vec3 worldNormal; out vec3 eyeVector; out vec3 vObjPos; out vec3 vObjNrm;
  out float vW, vWall; out vec4 vClip;
  uniform vec3 uCam;
  void main(){
    vec4 wp = uModel * vec4(aPos,1.0);
    worldNormal = normalize(uNormalMat * aNrm);
    eyeVector = normalize(wp.xyz - uCam);
    vObjPos = aPos; vObjNrm = aNrm; vW = aW; vWall = aWall;
    vClip = uViewProj * wp;
    gl_Position = vClip;
  }`;

  /* Both shaders in one program, selected by uMode, so the wipe is a fair
     comparison: identical geometry, identical dispersion loop. */
  const BOLT_FS = `#version 300 es
  precision highp float;
  in vec3 worldNormal; in vec3 eyeVector; in vec3 vObjPos; in vec3 vObjNrm;
  in float vW, vWall; in vec4 vClip;
  out vec4 fragColor;

  uniform sampler2D uTexture;
  uniform vec2 winResolution;
  uniform float uMode;      // 0 = current, 1 = new
  uniform float uTime;
  uniform float uIorR, uIorY, uIorG, uIorC, uIorB, uIorP;
  uniform float uSaturation, uChromaticAberration, uRefractPower;
  uniform float uFresnelPower, uShininess, uDiffuseness;
  uniform vec3 uLight;
  uniform float uBandSpread, uBandGain, uGlassGain, uEdgeBand, uMetalGain;

  #define TAU 6.28318530718
  const float HALF_D = 0.19345;
  const float HALF_H = 1.0;

  vec3 sat(vec3 rgb, float a){ const vec3 W=vec3(0.2125,0.7154,0.0721);
    return mix(vec3(dot(rgb,W)), rgb, a); }
  float fresnel(vec3 e, vec3 n, float p){ return pow(1.0 - abs(dot(e,n)), p); }
  float specular(vec3 light, float shin, float diff){
    vec3 n = worldNormal, lv = normalize(-light), hv = normalize(eyeVector + lv);
    float NdotH = dot(n, hv);
    return pow(NdotH*NdotH, shin) + max(0.0, dot(n, lv)) * diff;
  }
  vec3 spectrum(float x){
    float f = fract(x)*8.0, t = fract(f); t = t*t*(3.0-2.0*t);
    vec3 c0, c1;
    if      (f<1.0){ c0=vec3(0.05,0.98,1.00); c1=vec3(0.10,0.46,1.00); }
    else if (f<2.0){ c0=vec3(0.10,0.46,1.00); c1=vec3(0.46,0.20,1.00); }
    else if (f<3.0){ c0=vec3(0.46,0.20,1.00); c1=vec3(1.00,0.16,0.86); }
    else if (f<4.0){ c0=vec3(1.00,0.16,0.86); c1=vec3(1.00,0.24,0.28); }
    else if (f<5.0){ c0=vec3(1.00,0.24,0.28); c1=vec3(1.00,0.62,0.10); }
    else if (f<6.0){ c0=vec3(1.00,0.62,0.10); c1=vec3(0.94,1.00,0.16); }
    else if (f<7.0){ c0=vec3(0.94,1.00,0.16); c1=vec3(0.16,1.00,0.44); }
    else           { c0=vec3(0.16,1.00,0.44); c1=vec3(0.05,0.98,1.00); }
    return mix(c0,c1,t);
  }
  float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
  float ampAlong(float s){
    float a=0.5+0.5*sin(s*TAU*2.0+0.9), b=0.5+0.5*sin(s*TAU*5.0+2.3), c=0.5+0.5*sin(s*TAU-0.6);
    return mix(0.26, 1.0, smoothstep(0.12, 0.88, a*0.50+b*0.28+c*0.22));
  }
  vec2 boltCorner(int i){
    if(i==0) return vec2( 0.1159,  1.0000);
    if(i==1) return vec2( 0.1159,  0.3687);
    if(i==2) return vec2( 0.5129,  0.3687);
    if(i==3) return vec2(-0.1159, -1.0000);
    if(i==4) return vec2(-0.1159, -0.3687);
    return vec2(-0.5129, -0.3687);
  }
  float polyDist(vec2 p){
    float best = 1e9;
    for(int i=0;i<6;i++){
      int j=i+1; if(j>5) j=0;
      vec2 a=boltCorner(i), b=boltCorner(j), ab=b-a, ap=p-a;
      float h=clamp(dot(ap,ab)/dot(ab,ab),0.0,1.0);
      best = min(best, length(ap-ab*h));
    }
    return best;
  }
  vec3 softClip(vec3 c){
    float m=max(max(c.r,c.g),c.b);
    if(m<=0.82) return c;
    float t=m-0.82;
    return c*((0.82 + t/(1.0+t/0.18))/m);
  }

  const int LOOP = 8;

  void main(){
    vec2 uv = gl_FragCoord.xy / winResolution.xy;
    vec3 normal = worldNormal;
    vec3 color = vec3(0.0);

    // dispersion loop, identical in both modes; the only per-channel
    // sampling anywhere, and it only reads what is behind the glass
    for (int i = 0; i < LOOP; i++) {
      float slide = float(i)/float(LOOP)*0.1;
      vec3 rR = refract(eyeVector, normal, 1.0/uIorR);
      vec3 rY = refract(eyeVector, normal, 1.0/uIorY);
      vec3 rG = refract(eyeVector, normal, 1.0/uIorG);
      vec3 rC = refract(eyeVector, normal, 1.0/uIorC);
      vec3 rB = refract(eyeVector, normal, 1.0/uIorB);
      vec3 rP = refract(eyeVector, normal, 1.0/uIorP);
      float r = texture(uTexture, uv + rR.xy*(uRefractPower+slide*1.0)*uChromaticAberration).x*0.5;
      vec2 yo = uv + rY.xy*(uRefractPower+slide*1.0)*uChromaticAberration;
      float y = (texture(uTexture,yo).x*2.0 + texture(uTexture,yo).y*2.0 - texture(uTexture,yo).z)/6.0;
      float g = texture(uTexture, uv + rG.xy*(uRefractPower+slide*2.0)*uChromaticAberration).y*0.5;
      vec2 co = uv + rC.xy*(uRefractPower+slide*2.5)*uChromaticAberration;
      float c = (texture(uTexture,co).y*2.0 + texture(uTexture,co).z*2.0 - texture(uTexture,co).x)/6.0;
      float b = texture(uTexture, uv + rB.xy*(uRefractPower+slide*3.0)*uChromaticAberration).z*0.5;
      vec2 po = uv + rP.xy*(uRefractPower+slide*1.0)*uChromaticAberration;
      float p = (texture(uTexture,po).z*2.0 + texture(uTexture,po).x*2.0 - texture(uTexture,po).y)/6.0;
      color.r += r + (2.0*p + 2.0*y - c)/3.0;
      color.g += g + (2.0*y + 2.0*c - p)/3.0;
      color.b += b + (2.0*c + 2.0*p - y)/3.0;
      color = sat(color, uSaturation);
    }
    color /= float(LOOP);

    float specularLight = specular(uLight, uShininess, uDiffuseness);
    float f = fresnel(eyeVector, normal, uFresnelPower);

    if (uMode < 0.5) {
      // ---- current: white Fresnel rim ----
      vec3 c = color + specularLight;
      c += f * vec3(1.0);
      fragColor = vec4(c, 1.0);
      return;
    }

    // ---- new ----
    float wallMask   = 1.0 - smoothstep(0.34, 0.88, abs(vObjNrm.z));
    float acrossWall = clamp(vObjPos.z/(2.0*HALF_D) + 0.5, 0.0, 1.0);
    float axis       = clamp(vObjPos.y/(2.0*HALF_H) + 0.5, 0.0, 1.0);
    float inFromEdge = clamp(polyDist(vObjPos.xy)/uEdgeBand, 0.0, 1.0);
    float ndv = clamp(abs(dot(normalize(eyeVector), normal)), 0.0, 1.0);
    float amp = ampAlong(axis + uTime*0.012);

    float across = mix(1.0 - inFromEdge, acrossWall, wallMask);
    float cyc = uBandSpread * (0.85 + 0.45*sin(axis*TAU*2.2 + 0.4));
    float bt  = across*cyc + 0.42*(1.0-ndv) + 0.45*sin(axis*TAU) + uTime*0.022;
    vec3 band = spectrum(bt);

    vec3 col = vec3(0.5);                       // hard-light neutral
    col += color * uGlassGain;

    float up = normal.y*0.5+0.5, sx = normal.x*0.5+0.5;
    float metal = mix(0.30, 0.68, smoothstep(0.02, 0.98, up*0.70 + sx*0.30));
    metal *= 0.94 + 0.12*hash11(floor(axis*340.0));
    col = mix(col, vec3(metal), wallMask*uMetalGain*(1.0 - 0.55*amp));

    vec3 bandQuiet = mix(vec3(0.5), band, mix(0.42, 1.0, amp*amp));
    float faceBand = (1.0 - wallMask) * pow(1.0 - inFromEdge, 1.35);
    float weight = clamp((wallMask*0.97 + faceBand*0.92) * uBandGain, 0.0, 1.0);
    col = mix(col, bandQuiet, weight);

    col += specularLight * mix(vec3(1.0), band, 0.86) * mix(0.30, 1.0, amp) * 0.26;
    col += f * spectrum(bt + 0.35) * 0.38;

    fragColor = vec4(softClip(col), 1.0);
  }`;

  /* Final composite: emulate mix-blend-mode: hard-light against the DOM
     ground, and wipe between the two shaders. */
  const COMP_FS = `#version 300 es
  precision highp float;
  uniform sampler2D tOld, tNew;
  uniform vec2 uRes; uniform vec3 uGround; uniform float uSplit;
  out vec4 fragColor;
  vec3 hardLight(vec3 s, vec3 b){
    return mix(2.0*s*b, 1.0 - 2.0*(1.0-s)*(1.0-b), step(vec3(0.5), s));
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / uRes;
    vec4 s = (uv.x < uSplit) ? texture(tOld, uv) : texture(tNew, uv);
    vec3 col = mix(uGround, hardLight(s.rgb, uGround), s.a);
    float d = abs(uv.x - uSplit) * uRes.x;
    float line = 1.0 - smoothstep(0.0, 1.2, d - 0.4);
    col = mix(col, vec3(1.0) - uGround, line * 0.55);
    fragColor = vec4(col, 1.0);
  }`;

  const bgProg   = program(QUAD_VS, BG_FS);
  const boltProg = program(BOLT_VS, BOLT_FS);
  const compProg = program(QUAD_VS, COMP_FS);

  const emptyVao = gl.createVertexArray();
  const boltVao  = gl.createVertexArray();
  gl.bindVertexArray(boltVao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, BOLT.data, gl.STATIC_DRAW);
  const ST = 8*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,ST,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,ST,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,1,gl.FLOAT,false,ST,24);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,ST,28);
  gl.bindVertexArray(null);

  const SAMPLES = Math.min(4, gl.getParameter(gl.MAX_SAMPLES) || 0);
  function makeRT(w, h, ms) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const rt = { tex, fbo, w, h, msFbo:null, msC:null, msD:null, rb:null };
    if (ms && SAMPLES > 1) {
      rt.msC = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rt.msC);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, SAMPLES, gl.RGBA8, w, h);
      rt.msD = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rt.msD);
      gl.renderbufferStorageMultisample(gl.RENDERBUFFER, SAMPLES, gl.DEPTH_COMPONENT16, w, h);
      rt.msFbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, rt.msFbo);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rt.msC);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rt.msD);
    } else {
      rt.rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rt.rb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rt.rb);
    }
    rt.draw = rt.msFbo || rt.fbo;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return rt;
  }
  function resolveRT(rt) {
    if (!rt.msFbo) return;
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, rt.msFbo);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, rt.fbo);
    gl.blitFramebuffer(0,0,rt.w,rt.h, 0,0,rt.w,rt.h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, null); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, null);
  }
  function dropRT(rt) {
    if (!rt) return;
    gl.deleteTexture(rt.tex); gl.deleteFramebuffer(rt.fbo);
    if (rt.msFbo){ gl.deleteFramebuffer(rt.msFbo); gl.deleteRenderbuffer(rt.msC); gl.deleteRenderbuffer(rt.msD); }
    if (rt.rb) gl.deleteRenderbuffer(rt.rb);
  }

  let rtBg=null, rtB=null, rtOld=null, rtNew=null, VW=0, VH=0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth*dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight*dpr));
    if (w===VW && h===VH && rtBg) return;
    VW=w; VH=h; canvas.width=w; canvas.height=h;
    [rtBg,rtB,rtOld,rtNew].forEach(dropRT);
    rtBg  = makeRT(w,h,true);
    rtB   = makeRT(w,h,true);
    rtOld = makeRT(w,h,true);
    rtNew = makeRT(w,h,true);
  }

  const state = {
    dark: true, stars: true,
    motion: !window.matchMedia("(prefers-reduced-motion: reduce)").matches,
    rotX: 0.15, rotY: -0.061, split: 0.5
  };
  const GROUND_DARK  = [30/255, 30/255, 30/255];    // hero section
  const GROUND_LIGHT = [240/255, 240/255, 240/255]; // body

  function drawBg(){
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    gl.useProgram(bgProg.p);
    gl.uniform2f(bgProg.u.uRes, VW, VH);
    gl.uniform1f(bgProg.u.uStars, state.stars ? 1 : 0);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function drawBolt(back, srcTex, mode, model, nrmMat, viewProj, eye, t){
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
    gl.enable(gl.CULL_FACE); gl.cullFace(back ? gl.FRONT : gl.BACK);
    gl.disable(gl.BLEND);
    const u = boltProg.u;
    gl.useProgram(boltProg.p);
    gl.uniformMatrix4fv(u.uModel,false,model);
    gl.uniformMatrix3fv(u.uNormalMat,false,nrmMat);
    gl.uniformMatrix4fv(u.uViewProj,false,viewProj);
    gl.uniform3fv(u.uCam, eye);
    gl.uniform2f(u.winResolution, VW, VH);
    gl.uniform1f(u.uMode, mode);
    gl.uniform1f(u.uTime, t);
    gl.uniform1f(u.uIorR,1.15); gl.uniform1f(u.uIorY,1.16); gl.uniform1f(u.uIorG,1.18);
    gl.uniform1f(u.uIorC,1.22); gl.uniform1f(u.uIorB,1.366); gl.uniform1f(u.uIorP,1.22);
    gl.uniform1f(u.uRefractPower,0.16); gl.uniform1f(u.uChromaticAberration,0.52);
    gl.uniform1f(u.uSaturation,1.14); gl.uniform1f(u.uShininess,15.0);
    gl.uniform1f(u.uDiffuseness,0.52); gl.uniform1f(u.uFresnelPower,2.8);
    gl.uniform3f(u.uLight,-1.8,-0.5,-5.0);
    gl.uniform1f(u.uBandSpread,1.60); gl.uniform1f(u.uBandGain,0.92);
    gl.uniform1f(u.uGlassGain,0.55);  gl.uniform1f(u.uEdgeBand,0.274);
    gl.uniform1f(u.uMetalGain,0.30);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(u.uTexture, 0);
    gl.bindVertexArray(boltVao);
    gl.drawArrays(gl.TRIANGLES, 0, BOLT.count);
  }
  function renderMode(mode, target, model, nrmMat, viewProj, eye, t){
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtB.draw);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawBg(); drawBolt(true, rtBg.tex, mode, model, nrmMat, viewProj, eye, t);
    resolveRT(rtB);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.draw);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawBg(); drawBolt(false, rtB.tex, mode, model, nrmMat, viewProj, eye, t);
    resolveRT(target);
  }

  let t0 = performance.now(), tAnim = 0;
  function frame(now){
    const dt = Math.min((now - t0)/1000, 0.05); t0 = now;
    if (state.motion) tAnim += dt;
    resize();

    const aspect = VW/VH;
    const vFov = 30*Math.PI/180;
    const hFov = 2*Math.atan(Math.tan(vFov*0.5)*aspect);
    const dist = Math.max(1.18/Math.tan(vFov*0.5), 0.62/Math.tan(hFov*0.5)) * 1.06;
    const eye = new Float32Array([0,0,dist]);
    const viewProj = mul(perspective(vFov, aspect, 0.1, 60), lookAt(eye,[0,0,0],[0,1,0]));
    const bob = state.motion ? 0.06*Math.sin(tAnim*0.5) : 0;
    const model = rotXY(state.rotX, state.rotY + (state.motion ? 0.10*Math.sin(tAnim*0.31) : 0));
    model[13] += bob*0.15;
    const nrmMat = mat3of(model);

    gl.viewport(0,0,VW,VH);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtBg.draw);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    drawBg(); resolveRT(rtBg);

    renderMode(0.0, rtOld, model, nrmMat, viewProj, eye, tAnim);
    renderMode(1.0, rtNew, model, nrmMat, viewProj, eye, tAnim);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);
    gl.useProgram(compProg.p);
    gl.uniform2f(compProg.u.uRes, VW, VH);
    gl.uniform1f(compProg.u.uSplit, state.split);
    const g = state.dark ? GROUND_DARK : GROUND_LIGHT;
    gl.uniform3f(compProg.u.uGround, g[0], g[1], g[2]);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rtOld.tex);
    gl.uniform1i(compProg.u.tOld, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rtNew.tex);
    gl.uniform1i(compProg.u.tNew, 1);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    requestAnimationFrame(frame);
  }

  /* ---- interaction: near the divider drags it, elsewhere rotates ---- */
  let mode = null, lastX = 0, lastY = 0, pid = null;
  canvas.addEventListener("pointerdown", e => {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left)/r.width;
    mode = Math.abs(x - state.split) < 0.035 ? "split" : "rotate";
    if (mode === "split") state.split = Math.min(0.97, Math.max(0.03, x));
    lastX = e.clientX; lastY = e.clientY; pid = e.pointerId;
    canvas.setPointerCapture(pid); canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", e => {
    const r = canvas.getBoundingClientRect();
    if (!mode) {
      const x = (e.clientX - r.left)/r.width;
      canvas.style.cursor = Math.abs(x - state.split) < 0.035 ? "ew-resize" : "grab";
      return;
    }
    if (mode === "split") {
      state.split = Math.min(0.97, Math.max(0.03, (e.clientX - r.left)/r.width));
    } else {
      state.rotY += (e.clientX - lastX)*0.006;
      state.rotX += (e.clientY - lastY)*0.005;
      state.rotX = Math.max(-1.1, Math.min(1.1, state.rotX));
    }
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = () => {
    if (!mode) return;
    mode = null;
    if (pid !== null) { try { canvas.releasePointerCapture(pid); } catch(_){} pid = null; }
    canvas.classList.remove("dragging");
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  const $ = id => document.getElementById(id);
  const bDark=$("bDark"), bLight=$("bLight"), bStars=$("bStars"), bMotion=$("bMotion"), bReset=$("bReset");
  function applyGround(){
    document.documentElement.setAttribute("data-theme", state.dark ? "dark" : "light");
    bDark.setAttribute("aria-pressed", String(state.dark));
    bLight.setAttribute("aria-pressed", String(!state.dark));
  }
  bDark.addEventListener("click", () => { state.dark = true; applyGround(); });
  bLight.addEventListener("click", () => { state.dark = false; applyGround(); });
  bStars.addEventListener("click", () => {
    state.stars = !state.stars; bStars.setAttribute("aria-pressed", String(state.stars));
  });
  bMotion.addEventListener("click", () => {
    state.motion = !state.motion; bMotion.setAttribute("aria-pressed", String(state.motion));
  });
  bReset.addEventListener("click", () => {
    state.rotX = 0.15; state.rotY = -0.061; state.split = 0.5;
  });

  applyGround();
  bMotion.setAttribute("aria-pressed", String(state.motion));
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
