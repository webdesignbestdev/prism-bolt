<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Bolt — built bundle test</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; font: 400 12px/1.7 ui-monospace, Menlo, monospace; }

      /* Exactly the structure the Webflow guide describes, nothing else. */
      .prism-track { height: 300vh; position: relative; }
      .prism-stick { position: sticky; top: 0; height: 100vh; display: flex;
                     align-items: center; justify-content: center; }
      .prism-bolt  { width: min(72vw, 940px); height: 68vh; }

      .light { background: #F5F5F5; color: #171717; }
      .dark  { background: #171717; color: #F5F5F5; }
      .band  { padding: 16vh 8vw; }
      .tag   { position: absolute; left: 5vw; bottom: 6vh; opacity: 0.45;
               letter-spacing: 0.16em; text-transform: uppercase; font-size: 10px; }
    </style>
  </head>
  <body>
    <section class="prism-track light" data-prism-track>
      <div class="prism-stick">
        <div class="prism-bolt" data-prism-bolt data-background="#F5F5F5"></div>
        <div class="tag">light — #F5F5F5</div>
      </div>
    </section>

    <section class="band light">
      <p>Built bundle, loaded from a plain script tag. No module loader, no React.</p>
    </section>

    <section class="prism-track dark" data-prism-track>
      <div class="prism-stick">
        <div class="prism-bolt" data-prism-bolt data-background="#171717"></div>
        <div class="tag">dark — #171717</div>
      </div>
    </section>

    <section class="band dark"><p>End.</p></section>

    <!-- cache-busted so a rebuild is picked up without a hard reload -->
    <script>
      var s = document.createElement('script');
      s.src = '/dist/prism-bolt.min.js?v=' + Date.now();
      document.body.appendChild(s);
    </script>
  </body>
</html>
